<!DOCTYPE html>
<html lang="en">
<head></head>
<body style="display:none;">

<banner id="banner"></banner>
  <!-- Top Navbar -->
<nav id="nav"></nav>

<main>

<div id="content">  

    <!-- Main Content -->

    <div class="my-5 container">
        <h2 class="h1">What is deprivation?</h2>
        <p class="display-6">Deprivation refers to people’s unmet needs. It is a lack of access to the opportunities and resources we expect in our society.</p>
    </div>

    <div id="background-map" class="container-fluid">

        <div class="container">
            <div class="row">
        <div class="col mb-3">
            <div class="card h-100 d-flex flex-column">
                <div class="card-body">
                    <p class="display-6 mb-1">Find out about deprivation in your neighbourhood:</p>
                    <div class="postcode-search">
  <div class="input-group">
    <input
      id="postcode-search"
      type="search"
      class="form-control"
      placeholder="Enter postcode"
      aria-label="Enter postcode"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false">

    <button
      id="postcode-go"
      class="btn btn-primary"
      type="button">
      Go
    </button>
  </div>

  <div id="postcode-dropdown" class="postcode-dropdown"></div>
</div>
                </div>
            </div>
        </div>
            
        <div class="col mb-3">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <p class="display-6 mb-5">Explore deprivation by council:</p>
                    <select id="lgd-select" class="form-select" aria-label="Select a council area"></select>
                </div>
            </div>
        </div>
    </div>
        </div>

    </div>
     
    
        
        
    <div class="grey-bg h5 text-end mt-1 border">
        <a href="https://www.nisra.gov.uk/statistics/people-and-communities/deprivation-and-poverty" target="_blank" noopener="rel" title="Deprivation statistics on the NISRA website (opens in new window)">
            View more deprivation resources and information
        </a>
    </div>

    </main>
</div>

<footer id = "footer"></footer>

<script type = "module" src="src/index.js"></script>

</body>
